<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload File Example</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #222;
      font-family: Arial, sans-serif;
    }

    #main {
      display: flex;

      width: 100%;
      height: 100%;
      background-color: #222;
      padding: 30px;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    #card {
      background-color: #fff;
      padding: 30px;
      width: 320px;
      text-align: center;
      display :inline-block;
      margin-top:40px;
      border-radius:30px;
    }

    #card h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .profile{
      width:40px;
      border-radius:50%;
      background-color:red;

    }
   
  </style>
</head>
<body>
  <div id="main">
    <form id="userForm">
      <input type="text" id="name" placeholder="profile">
      <input type="text" id="age" placeholder="name">
      <input type="text" id="profile" placeholder="info">
      
      <input type="submit" id="btn" value="Submit">
    </form>
  </div>



  </div>
  <script src="12_Events_submit.js"></script>
</body>
</html>
