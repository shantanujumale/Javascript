<!DOCTYPE html>
<html>
<head>
    <title>001_demo</title>
    <style>

     .img{
        width:100%;
        height:100%;
     }  
    </style>
</head>

<body>

<h1 id = 't'>Hello JavaScript</h1>
<img id="photo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2CVNHuOh6IUJlfVf3yE3FmjxloHgkhDUJR-F4PvzmHI3AIcBBhIkbxbE&s=10" alt="Hello Teena..." width="200">

<button onclick="change()">Submit</button>




<script>


function change(){
    let img=document.getElementById("photo");

    let e1 = 'https://img.magnific.com/free-psd/earth-ball-school-education_23-2151848239.jpg?semt=ais_test_b&w=740&q=80';
    let e2 = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2CVNHuOh6IUJlfVf3yE3FmjxloHgkhDUJR-F4PvzmHI3AIcBBhIkbxbE&s=10';

    if (img.getAttribute('src')=== e1){
        img.setAttribute('src',e2);
        img.setAttribute('width','200');
    }

    else{
        img.setAttribute('src',e1);
        img.setAttribute('width','200');
    }

}

</script>   

</body>
</html>
