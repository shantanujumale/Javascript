<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic JSON Table Render</title>
  <!-- Correct jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h2>Data Loaded via Native fetch()</h2>
  <table id="fetch-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="fetch-tbody"><!-- Data will inject here --></tbody>
  </table>

  <h2>Data Loaded via jQuery $.getJSON()</h2>
  <table id="jquery-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="jquery-tbody"><!-- Data will inject here --></tbody>
  </table>

  <script>
    // Correct API URL
    const apiUrl = 'https://jsonplaceholder.typicode.com/users';

    // --- METHOD 1: Native JavaScript fetch() ---
    function loadDataWithFetch() {
      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          const tbody = document.getElementById('fetch-tbody');
          let rows = '';
          
          data.forEach(user => {
            rows += `<tr>
              <td>${user.id}</td>
              <td>${user.name}</td>
              <td>${user.email}</td>
            </tr>`;
          });
          
          tbody.innerHTML = rows;
        })
        .catch(error => console.error('Fetch error:', error));
    }

    // --- METHOD 2: jQuery $.getJSON() ---
    function loadDataWithjQuery() {
      $.getJSON(apiUrl, function(data) {
        let rows = '';
        
        $.each(data, function(index, user) {
          rows += `<tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
          </tr>`;
        });
        
        $('#jquery-tbody').html(rows);
      })
      .fail(function(jqXHR, textStatus, errorThrown) {
        console.error('jQuery error:', textStatus, errorThrown);
      });
    }

    // Execute both methods when the DOM is fully loaded
    document.addEventListener('DOMContentLoaded', () => {
      loadDataWithFetch();
      loadDataWithjQuery();
    });
  </script>
</body>
</html>
